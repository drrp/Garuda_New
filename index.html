<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUCHITHYAM Paper Formatter</title>
    <meta name="description" content="An intelligent text formatting tool that cleans, structures, and styles your Telugu and English text according to academic standards using AI. It handles spacing, paragraphing, citations (MLA/APA), and font application." />
    <meta property="og:title" content="AUCHITHYAM Paper Formatter" />
    <meta property="og:description" content="An intelligent text formatting tool that cleans, structures, and styles your Telugu and English text according to academic standards using AI. It handles spacing, paragraphing, citations (MLA/APA), and font application." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dhurjati&family=Gidugu&family=Inter:wght@400;500;600;700;800;900&family=Mallanna&family=Mandali&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Peddana&family=Ramabhadra&family=Ravi+Prakash&family=Sree+Krushnadevaraya&family=Suravaram&family=Tenali+Ramakrishna&family=Timmana&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      @keyframes fade-in-scale {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-fade-in-scale {
        animation: fade-in-scale 0.3s ease-out;
      }
      @keyframes glow-pulse {
        0%, 100% {
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4), 0 0 20px rgba(56, 189, 248, 0.3);
            transform: scale(1);
        }
        50% {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.7), 0 0 30px rgba(56, 189, 248, 0.5);
            transform: scale(1.05);
        }
      }
      .animate-glow-pulse {
        animation: glow-pulse 3s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-200">
    <div id="root">
      <div class="min-h-screen flex items-center justify-center bg-slate-900 text-slate-400">
        <div class="text-center">
          <div class="inline-block w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
          <p class="font-medium text-lg text-slate-300">Loading Garuda...</p>
        </div>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
